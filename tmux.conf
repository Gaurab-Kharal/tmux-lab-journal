# ~/.tmux.conf

# -------------------------
# Prefix
# -------------------------

# Keep the default Ctrl+b.
# Don't change it while learning tmux.


# -------------------------
# General
# -------------------------

# Start numbering windows/panes from 1
set -g base-index 1
setw -g pane-base-index 1

# Re-number windows when one is closed
set -g renumber-windows on

# Allow mouse support
# (hold Shift while dragging to use Konsole's own selection/clipboard)
set -g mouse on

# Reduce delay after pressing Escape
set -sg escape-time 10

# Scrollback history (default is only 2000 lines)
set -g history-limit 50000

# Pass focus events to programs like Neovim
set -g focus-events on

# Vim keys in copy mode (matches h/j/k/l pane movement)
setw -g mode-keys vi


# -------------------------
# Terminal / colors
# -------------------------

# Correct TERM inside tmux (helps Neovim colors/italics)
set -g default-terminal "tmux-256color"

# Enable true color
set -as terminal-features ",xterm-256color:RGB"


# -------------------------
# Pane navigation
# -------------------------

# Vim-style pane movement
# Note: this overrides the default Ctrl+b l (last window).
# Use Ctrl+b Tab for last window instead (see Windows section).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# -------------------------
# Pane resizing
# -------------------------

# -r = repeatable: Ctrl+b H, then keep tapping H without the prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# -------------------------
# Splitting
# -------------------------

# Split while keeping the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# -------------------------
# Windows
# -------------------------

# New window starts in current directory
bind c new-window -c "#{pane_current_path}"

# Easy window switching
bind Tab last-window


# -------------------------
# Reload configuration
# -------------------------

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"


# -------------------------
# Dark Purple / Neovim Theme
# -------------------------
# Icons are written as \uXXXX escapes (Nerd Font / Font Awesome codepoints)
# so they survive copy-paste. Requires a Nerd Font in Konsole.
#   \uf120 = terminal icon (session)
#   \uf111 = filled circle (active window)

set -g status-position bottom
set -g status-interval 5

# Main bar — transparent through Konsole
set -g status-style "bg=default,fg=#91899e"

# -------------------------
# Left: Session
# -------------------------

# Default length is 10 chars, which truncates longer session names
set -g status-left-length 40
set -g status-left "#[fg=#c4a7e7,bold] \uf120 #S #[fg=#403747]│"

# -------------------------
# Windows
# -------------------------

# Inactive windows
set -g window-status-style "bg=default,fg=#777080"
set -g window-status-format " #[fg=#6f6878]#I #[fg=#91899e]#W "

# Active window
set -g window-status-current-style "bg=#211a29,fg=#d8cbea"
set -g window-status-current-format "#[fg=#c4a7e7,bold] \uf111 #I:#W #[fg=#8b6aa8]"

# -------------------------
# Right: Time / Date
# -------------------------

set -g status-right "#[fg=#777080]%H:%M #[fg=#403747]│ #[fg=#91899e]%d-%b  "

# -------------------------
# Pane borders
# -------------------------

# Inactive pane
set -g pane-border-style "fg=#29232f"

# Active pane
set -g pane-active-border-style "fg=#76558f"
